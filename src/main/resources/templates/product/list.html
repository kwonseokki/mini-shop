<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{/layout/layout}"
>
<head>
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div layout:fragment="content">
<div class="container">
  <div class="row">
    <div class="col-md-3 mb-4" th:each="product: ${productList}">
      <div class="card" style="width: 15rem; height: 375px;">
        <img th:src="${product.filePath}" class="card-img-top" th:alt="${product.name}">
        <div class="card-body">
          <h6 th:text="${product.name}" class="card-title"></h6>
          <p th:text="${product.description}" class="card-text"></p>
          <p th:text="${#numbers.formatInteger(product.price, 0, 'COMMA') + '원'}" class="text-danger fw-semibold"></p>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
</body>
</html>

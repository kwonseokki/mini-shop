<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{/layout/layout}"
>
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <style>
    .login-container {
      max-width: 500px;
    }
  </style>
</head>
<body>
<div layout:fragment="content">
<form action="login" method="post" class="container login-container">
  <div>
    <div th:if="${message}" class="alert alert-danger">
      <span th:text="${message}"></span>
    </div>
    <div class="mb-3 row">
      <label for="staticEmail" class="col-sm-2 col-form-label">Email</label>
      <div class="col-sm-10">
        <input name="email" type="text" class="form-control" id="staticEmail" value="email@example.com">
      </div>
    </div>
    <div class="mb-3 row">
      <label for="inputPassword" class="col-sm-2 col-form-label">Password</label>
      <div class="col-sm-10">
        <input name="pwd" type="password" class="form-control" id="inputPassword">
      </div>
    </div>
  </div>
  <button type="submit" class="btn btn-primary w-100">로그인</button>
</form>
</div>
</body>
</html>
